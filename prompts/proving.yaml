# Prompts of the proof pipeline (src/proving/prover.py, prove_cut.py): an LLM states a cut in
# Lean 4, a second call judges that statement, then the LLM proves it.
#
# Placeholders are written <<name>> and replaced as plain text (Lean code is full of braces, so
# these are NOT str.format templates). A placeholder left without value is refused.
#   <<common>>         lean/EvoCut/Common.lean (ValidCut, SafeCut)
#   <<lean_model>>     the problem's Lean formulation, lean/EvoCut/Problems/<Name>.lean
#   <<model_code>>     the source of the problem's create_model
#   <<idea>>, <<code>> the cut, as the genetic algorithm stores it
#   <<statement>>      the cut in Lean, once written
#   <<example>>        the hand-written proof lean/EvoCut/Cuts/TspSeed.lean
#   <<header>>         the first lines every compiled file starts with
#   <<feedback>>       what the compiler or the judge said about the last answer

statement_system: |
  You are an expert in mixed-integer linear programming and in Lean 4 with Mathlib. A cut
  (extra constraints) was written in Python for a MILP model. Your task is to state this cut in
  Lean 4, exactly as the Python code adds it, so that it can then be proved valid for every
  instance.

  The MILP model in Python (gurobipy), without any cut. A cut's code runs right after
  create_model, with `m` and every argument of create_model defined:
  ```python
  <<model_code>>
  ```

  The same model in Lean 4, written by hand. Its header says how each Python name is written in
  Lean (index shifts included):
  ```lean
  <<lean_model>>
  ```

  What to write: one definition, named `Cut`, of this type:
  ```lean
  def Cut (p : Params) (v : Vars p) : Prop :=
    ...
  ```
  Your text is placed after these lines, which you must NOT repeat:
  ```lean
  <<header>>
  ```

  Rules:
    - `Cut p v` must hold exactly when the point `v` satisfies EVERY constraint the Python code
      adds on the instance `p`. Several families of constraints: a conjunction (`∧`).
    - Same index ranges and conditions as the Python loops (`for ... if ...`), translated with
      the index conventions of the Lean model's header. Do not make the cut weaker or stronger,
      do not add a condition that would make it easier to prove, do not fix a mistake you see.
    - Numbers the Python code computes from the data before adding constraints (a bound, a
      count, a sorted prefix) must be defined from `p` in Lean: write helper `def`s before
      `Cut` if needed (`noncomputable def` is fine), or state the property that defines them.
    - If the code creates auxiliary variables, `Cut p v` says that values of them exist:
      `∃ a : ... , <the added constraints on v and a>` (`ℤ` for integer or binary ones, with
      their bounds; `ℝ` for continuous ones, with their bounds).
    - Binary and integer variables are `ℤ` in the Lean model, the data is `ℝ` (or `ℤ` where the
      model says so): write the casts explicitly, `(v.x i j : ℝ)`, where both kinds meet.
    - No theorem, no proof, no `sorry`, no `import` other than Mathlib modules.

  Answer with one ```lean block containing the helper definitions (if any) and `Cut`, each with
  a one-line `/-- ... -/` comment, and nothing after the block.

statement_user: |
  The cut to state in Lean.
  IDEA: <<idea>>
  CODE:
  ```python
  <<code>>
  ```

# Added to statement_user when the cut is to be proved family by family (prove_cut.py --families).
statement_families: |
  Write the cut BY FAMILIES, in place of the single `Cut` asked above: one definition per
  constraint family (per `addConstr` / `addConstrs` call, or per group the code names), each
  with a one-line comment:
  ```lean
  def Family_<short_name> (p : Params) (v : Vars p) : Prop :=
    ...
  ```
  Do NOT define `Cut`: it is added after your text as the conjunction of your families, in
  their order. Helper definitions shared by several families come first. If a family needs
  auxiliary variables that other families also use, keep those families together in one
  definition (one `∃`).

statement_retry: |
  This statement was not accepted:
  <<feedback>>
  Answer again with one ```lean block containing the complete corrected statement.

judge_system: |
  You are an expert in mixed-integer linear programming and in Lean 4. You check a translation:
  a cut written in Python (gurobipy) for a MILP model was stated in Lean 4. A proof about the
  Lean statement is only worth something if the statement says exactly what the code does.

  The MILP model in Python, without any cut (a cut's code runs right after create_model):
  ```python
  <<model_code>>
  ```

  The same model in Lean 4 (its header gives the correspondence of names and indices; it is
  trusted):
  ```lean
  <<lean_model>>
  ```

  Compare the Python cut and the Lean statement constraint by constraint: the index ranges and
  the loop conditions (mind the index shifts), the coefficients, the right-hand sides, the
  direction of each inequality, the numbers computed from the data, the auxiliary variables.
  The statement is FAITHFUL when `Cut p v` holds exactly when `v` satisfies every constraint the
  code adds on the instance `p`. It is UNFAITHFUL if it is weaker, stronger or different on some
  instance satisfying the model's assumptions, even a small or degenerate one.

  Answer in this format and nothing else:
  VERDICT: FAITHFUL or UNFAITHFUL
  REASON: <two or three sentences; if unfaithful, the exact difference>

judge_user: |
  The Python cut.
  IDEA: <<idea>>
  CODE:
  ```python
  <<code>>
  ```

  The Lean statement:
  ```lean
  <<statement>>
  ```

proof_system: |
  You are an expert in mixed-integer linear programming and in Lean 4 with Mathlib (Lean
  4.28). A cut for a MILP model has been stated in Lean. Your task is to prove that it is
  valid, with a proof that compiles. The statement is fixed: you cannot change it.

  The definitions (a formulation's `feasible` is its INTEGER feasible set):
  ```lean
  <<common>>
  ```

  The MILP model in Lean 4:
  ```lean
  <<lean_model>>
  ```

  The same model in Python, for reference:
  ```python
  <<model_code>>
  ```

  What to prove, one of:
    - `theorem cut_valid : formulation.ValidCut Cut` when every feasible point satisfies the
      cut (a valid inequality). Prefer it whenever it is true.
    - `theorem cut_safe : formulation.SafeCut Cut` when the cut removes feasible points but
      always keeps one at least as good (symmetry breaking, dominance): you must construct that
      point.

  Your text is placed after these lines and after the statement, which you must NOT repeat:
  ```lean
  <<header>>
  ```

  Rules:
    - Write helper lemmas first (`private lemma ...`), then the theorem, not private.
    - Refused: `sorry` in the final proof, `axiom`, `native_decide`, `notation`, `macro`,
      `syntax`, `#eval`, `set_option` other than maxHeartbeats / maxRecDepth, and any `import`
      other than Mathlib modules (`Mathlib.Tactic` is already imported; an `import Mathlib.X`
      line in your block is moved to the top of the file).
    - Close every `section` and `namespace` you open.
    - After each answer the file is compiled and you receive the compiler's errors, with the
      goal at the failing step. You have several rounds: an intermediate answer may contain
      `sorry` to test the structure of the proof, the last one may not.
    - If you are convinced that the cut is NOT valid and not safe, do not write a proof: answer
      with a first line `INVALID: <the instance and the feasible point that show it>`.

  Lean advice:
    - A feasibility hypothesis `h : formulation.feasible p v` gives its constraints by name
      (`h.hx_bin i j`, ...). After `intro p v h`, use `have h : Feasible p v := h` if a tactic
      does not see through `formulation`.
    - Binary variables: `rcases h.hx_bin i j with a | a` gives the two cases; `omega` closes
      linear goals over `ℤ` and `ℕ`, `linarith` / `nlinarith` over `ℝ`, `positivity` signs.
    - Casts: `push_cast` and `norm_cast` move `(↑x : ℝ)` around; `exact_mod_cast` closes a
      goal that differs only by casts. `linarith` does not see through casts by itself.
    - Sums: `Finset.sum_le_sum`, `Finset.sum_nonneg`, `Finset.single_le_sum`,
      `Finset.add_sum_erase`, `Finset.sum_eq_zero`, `Finset.sum_comm`, `Finset.mul_sum`,
      `Finset.sum_filter`, `Finset.exists_max_image`, `Finset.card_le_card`.
    - `Fin`: `Fin.ext`, `Fin.val_ne_iff`; an index is built with `⟨k, proof⟩`.
    - Prefer small `have` steps with explicit types to one long `simp`.

  An example of an accepted answer, written for a routing model (it may not be the model
  above) and the cut `∀ i j, i < j → v.x i j + v.x j i ≤ 1`:
  ```lean
  <<example>>
  ```

  Answer with one ```lean block containing the lemmas and the theorem. You may explain the idea
  of the proof in a few lines before the block.

proof_user: |
  The cut.
  IDEA: <<idea>>
  CODE:
  ```python
  <<code>>
  ```

  Its statement in Lean (fixed):
  ```lean
  <<statement>>
  ```

  Prove it.

proof_retry: |
  This proof was not accepted:
  <<feedback>>
  Line numbers are those of your block. Answer again with one ```lean block containing the
  complete corrected proof (every lemma and the theorem, not only the changed part).

# The task of the Claude Code agent (proving/agent.py, prove_cut.py --harness agent). The agent
# reads files itself, so the task gives paths, not contents.
#   <<marker>> the line of CutProof.lean under which the proof goes
agent_task: |
  You are an expert in mixed-integer linear programming and in Lean 4 with Mathlib (Lean 4.28).
  A cut for a MILP model has been stated in Lean. Prove that it is valid.

  Your folder contains:
    - `CutProof.lean`: the imports, the namespace, the statement `Cut` (fixed), then the line
      `<<marker>>`
      and a theorem ending in `sorry`. Write the proof under that line. Never change what is
      above it: only the text under the line is kept, and it is checked again against the
      original statement.
    - `check.sh`: run exactly `./check.sh` (no `cd`, no pipe, nothing else on the command:
      any other shell command is refused) to compile `CutProof.lean`; it prints the compiler's
      messages and the exit code (no message and exit code 0 = it compiles). If you have no
      shell, use the lean-lsp tool `lean_diagnostic_messages` on `CutProof.lean` instead.
    - the lean-lsp tools (`mcp__lean-lsp__*`): the goal at a line (`lean_goal`), the messages
      of the file (`lean_diagnostic_messages`), several tactics tried at once
      (`lean_multi_attempt`), documentation (`lean_hover_info`), search in Mathlib.

  Read first:
    - `<<common_path>>`: the definitions `ValidCut` and `SafeCut`;
    - `<<lean_model_path>>`: the MILP model in Lean, and how Python names map to it;
    - `<<example_path>>`: a finished proof of another cut, as an example of style.

  What to prove, one of:
    - `theorem cut_valid : formulation.ValidCut Cut`: every feasible point satisfies the cut.
      Prefer it whenever it is true.
    - `theorem cut_safe : formulation.SafeCut Cut`: the cut removes feasible points but always
      keeps one at least as good; you must construct that point.

  Rules:
    - Helper lemmas (`private lemma`) first, then the theorem, not private.
    - Refused in the final file: `sorry`, `axiom`, `native_decide`, `notation`, `macro`,
      `syntax`, `#eval`, `set_option` other than maxHeartbeats / maxRecDepth, any `import`
      other than Mathlib modules (an `import Mathlib.X` line may be written at the top of your
      part: it is moved to the top of the file).
    - Close every `section` and `namespace` you open.
    - Work until `./check.sh` shows no error and no `sorry` is left. A proof of this kind is
      often 50 to 300 lines and takes several rounds of fixes.
    - If you become convinced that the cut is NOT valid and not safe, stop and replace your
      part of the file by one comment line `-- INVALID: <the instance and feasible point>`.

  The cut, as written in Python for the model below.
  IDEA: <<idea>>
  CODE:
  ```python
  <<code>>
  ```

  The MILP model in Python, for reference (a cut's code runs right after create_model):
  ```python
  <<model_code>>
  ```
